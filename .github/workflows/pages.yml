name: PALIMPSEST build

# GitHub Pages serves this branch straight from the repository root (index.html + assets/ are the
# built game). `npm run build` regenerates them locally; this workflow is the safety net: it runs
# the tests, rebuilds, and commits the result if the committed build was stale.
on:
  push:
    branches: [palimpsest]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palimpsest-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit the rebuilt game if it changed
        run: |
          git add -A index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "Committed build is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild game"
            git push
          fi
