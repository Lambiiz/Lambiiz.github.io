name: Build

# The playable game is the built files at the repository root (index.html + assets/), served by
# GitHub Pages straight from the branch. Contributors run `npm run build` before committing; this
# workflow is the safety net: it runs the tests, rebuilds, and commits the result if it was stale.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit the rebuilt game if it changed
        run: |
          git add -A index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "Build is up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild game"
            git push
          fi
